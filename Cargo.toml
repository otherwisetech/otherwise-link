[workspace]
resolver = "2"
members = ["crates/link", "crates/hub"]

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/otherwisetech/otherwise-link"

[workspace.dependencies]
otherwise-link = { path = "crates/link" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same versions as vigia-rs, nodo-rs and expense-rs: two libsqlite3-sys in one build don't link.
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tempfile = "3"
